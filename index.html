<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UtsavAI - Cinematic Festival Poster</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #030712;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #0f172a;
            border: 2px solid #fbbf24;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            padding: 20px;
        }

        .hidden {
            display: none !important;
        }

        h2 {
            text-align: center;
            color: #fbbf24;
            font-size: 18px;
            margin-bottom: 15px;
            font-family: 'Cinzel', serif;
        }

        /* Festival Selection Grid */
        .festival-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .festival-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 18px 10px;
            border-radius: 14px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .festival-card:hover {
            border-color: #fbbf24;
            background: rgba(251, 191, 36, 0.1);
        }

        .festival-card i {
            font-size: 26px;
            margin-bottom: 6px;
            color: #fbbf24;
        }

        .festival-card h4 {
            font-size: 13px;
        }

        /* Form */
        .back-link {
            display: inline-block;
            margin-bottom: 10px;
            color: #fbbf24;
            text-decoration: none;
            font-size: 13px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            color: #94a3b8;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .file-box {
            border: 2px dashed rgba(251, 191, 36, 0.5);
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            background: rgba(251, 191, 36, 0.02);
        }

        .file-box p {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .file-box input {
            display: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            color: white;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }

        /* CINEMATIC POSTER PREVIEW (Jaise Reference Image me hai) */
        .poster-box {
            position: relative;
            width: 100%;
            height: 480px;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            margin-bottom: 15px;
            border: 2px solid #fbbf24;
            background-size: cover;
            background-position: center;
        }

        /* Background overlay for rich cinematic lighting */
        .poster-box::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, transparent 40%, rgba(0,0,0,0.85) 80%);
            z-index: 1;
            pointer-events: none;
        }

        .poster-header, .poster-footer, .user-cutout-container {
            position: relative;
            z-index: 2;
        }

        .wish-top {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fde047;
            font-weight: 600;
        }

        .festival-main-title {
            font-size: 24px;
            font-weight: 900;
            font-family: 'Cinzel', serif;
            color: #fffaea;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 20px rgba(251, 191, 36, 0.8);
            margin: 2px 0;
        }

        .festival-sub {
            font-size: 10px;
            color: #e2e8f0;
            padding: 0 10px;
        }

        /* Full User Photo Custom Frame */
        .user-cutout-container {
            width: 130px;
            height: 150px;
            margin: 0 auto;
            border-radius: 12px;
            border: 3px solid #fbbf24;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.8);
            background: #000;
        }

        .user-cutout-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.05) saturate(1.1);
        }

        .name-banner {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(251, 191, 36, 0.5);
            padding: 6px 15px;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 4px;
        }

        .name-display {
            font-size: 18px;
            font-weight: 700;
            color: #fbbf24;
            font-family: 'Cinzel', serif;
        }

        .footer-tag {
            font-size: 9px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #cbd5e1;
        }

        .whatsapp-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. SELECTION -->
        <div id="selection-section">
            <h2>✨ Cinematic Poster Generator</h2>
            <div class="festival-grid">
                <div class="festival-card" onclick="selectFestival('DIWALI SPECIAL', '🪔', 'शुभ दीपावली', 'सुख, समृद्धि और प्रकाश का पर्व मंगलमय हो।', 'linear-gradient(135deg, #78350f, #1e1b4b)')">
                    <i class="fa-solid fa-fire-flame-curved"></i>
                    <h4>Diwali</h4>
                </div>
                <div class="festival-card" onclick="selectFestival('HOLI SPECIAL', '🎨', 'रंगों का त्योहार होली', 'अपनों के साथ खुशियों का रंग बरसे।', 'linear-gradient(135deg, #831843, #1e1b4b)')">
                    <i class="fa-solid fa-palette"></i>
                    <h4>Holi</h4>
                </div>
                <div class="festival-card" onclick="selectFestival('INDEPENDENCE DAY', '🇮🇳', 'स्वतंत्रता दिवस', 'वंदे मातरम् • जय हिन्द', 'linear-gradient(135deg, #14532d, #0f172a)')">
                    <i class="fa-solid fa-flag"></i>
                    <h4>Independence</h4>
                </div>
                <div class="festival-card" onclick="selectFestival('NEW YEAR', '✨', 'नव वर्ष 2026', 'नया साल ढेरों खुशियां लेकर आए।', 'linear-gradient(135deg, #1e3a8a, #0f172a)')">
                    <i class="fa-solid fa-champagne-glasses"></i>
                    <h4>New Year</h4>
                </div>
                <div class="festival-card" onclick="selectFestival('BIRTHDAY SPECIAL', '🎂', 'जन्मदिन की बधाई', 'ईश्वर आपको दीर्घायु और सफलता दें।', 'linear-gradient(135deg, #581c87, #0f172a)')" style="grid-column: span 2;">
                    <i class="fa-solid fa-cake-candles"></i>
                    <h4>Birthday Celebration</h4>
                </div>
            </div>
        </div>

        <!-- 2. FORM -->
        <div id="form-section" class="hidden">
            <a class="back-link" onclick="goBackToSelection()"><i class="fa-solid fa-arrow-left"></i> Back</a>
            <h2 id="form-heading">Enter Details</h2>
            
            <form id="bannerForm">
                <div class="form-group">
                    <label>Aapka Naam</label>
                    <input type="text" id="userName" placeholder="Jaise: Mahendra" required>
                </div>
                <div class="form-group">
                    <label>Aapki Photo</label>
                    <div class="file-box" onclick="document.getElementById('userPhoto').click()">
                        <i class="fa-solid fa-image fa-2x" style="color: #fbbf24;"></i>
                        <p id="file-label">Photo upload karein</p>
                        <input type="file" id="userPhoto" accept="image/*" required onchange="previewImageName()">
                    </div>
                </div>
                <button type="submit" class="btn">Generate Cinematic Poster</button>
            </form>
        </div>

        <!-- 3. PREVIEW -->
        <div id="preview-section" class="hidden">
            <h2>🔥 Poster Ready!</h2>
            
            <div class="poster-box" id="posterCard">
                <div class="poster-header">
                    <div class="wish-top" id="poster-wish">शुभ दीपावली</div>
                    <div class="festival-main-title" id="poster-title">DIWALI SPECIAL</div>
                    <div class="festival-sub" id="poster-sub">सुख, समृद्धि और प्रकाश का पर्व मंगलमय हो।</div>
                </div>
                
                <div class="user-cutout-container">
                    <img id="preview-img" src="" alt="User Photo">
                </div>

                <div class="poster-footer">
                    <div class="name-banner">
                        <div class="name-display" id="preview-name">Mahendra</div>
                    </div>
                    <div class="footer-tag">Stay Blessed • Stay Happy</div>
                </div>
            </div>

            <button class="btn whatsapp-btn" onclick="shareOnWhatsApp()">
                <i class="fa-brands fa-whatsapp"></i> Share on WhatsApp
            </button>
            <button class="btn" style="background: rgba(255,255,255,0.1); margin-top: 8px;" onclick="goBackToSelection()">Create Another</button>
        </div>
    </div>

    <script>
        const selectionSection = document.getElementById('selection-section');
        const formSection = document.getElementById('form-section');
        const previewSection = document.getElementById('preview-section');
        const formHeading = document.getElementById('form-heading');
        
        const posterWish = document.getElementById('poster-wish');
        const posterTitle = document.getElementById('poster-title');
        const posterSub = document.getElementById('poster-sub');
        const previewName = document.getElementById('preview-name');
        const previewImg = document.getElementById('preview-img');
        const posterCard = document.getElementById('posterCard');
        const bannerForm = document.getElementById('bannerForm');
        
        let selectedTitle = "";
        let selectedWishText = "";
        let selectedSubText = "";
        let selectedGradient = "";
        let uploadedImageUrl = "";

        function selectFestival(title, emoji, wish, sub, gradient) {
            selectedTitle = emoji + " " + title;
            selectedWishText = wish;
            selectedSubText = sub;
            selectedGradient = gradient;
            formHeading.innerText = title;
            selectionSection.classList.add('hidden');
            formSection.classList.remove('hidden');
        }

        function goBackToSelection() {
            formSection.classList.add('hidden');
            previewSection.classList.add('hidden');
            selectionSection.classList.remove('hidden');
            bannerForm.reset();
            document.getElementById('file-label').innerText = "Photo upload karein";
        }

        function previewImageName() {
            const input = document.getElementById('userPhoto');
            const label = document.getElementById('file-label');
            if(input.files && input.files[0]) {
                label.innerText = "Selected: " + input.files[0].name;
                label.style.color = "#22c55e";

                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImageUrl = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        bannerForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('userName').value;

            posterTitle.innerText = selectedTitle;
            posterWish.innerText = selectedWishText;
            posterSub.innerText = selectedSubText;
            previewName.innerText = name;
            posterCard.style.background = selectedGradient;

            if(uploadedImageUrl) {
                previewImg.src = uploadedImageUrl;
            }

            formSection.classList.add('hidden');
            previewSection.classList.remove('hidden');
        });

        function shareOnWhatsApp() {
            const text = `Maine apna cinematic festival poster banaya hai! Aap bhi yahan bana sakte hain: ${window.location.href}`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
        }
    </script>
</body>
</html>
