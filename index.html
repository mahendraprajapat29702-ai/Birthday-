<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Designer Festival & Birthday Banner</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #090d16;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: #111827;
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            padding: 25px;
        }

        .hidden {
            display: none !important;
        }

        h2 {
            text-align: center;
            color: #fbbf24;
            font-size: 20px;
            margin-bottom: 20px;
            font-family: 'Cinzel', serif;
        }

        /* 1. Festival Grid */
        .festival-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .festival-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 20px 15px;
            border-radius: 18px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .festival-card:hover {
            border-color: #fbbf24;
            background: rgba(251, 191, 36, 0.08);
            transform: translateY(-3px);
        }

        .festival-card i {
            font-size: 30px;
            margin-bottom: 8px;
            color: #fbbf24;
        }

        .festival-card h4 {
            font-size: 14px;
        }

        /* 2. Input Form */
        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #fbbf24;
            text-decoration: none;
            font-size: 13px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #94a3b8;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #fbbf24;
        }

        .file-box {
            border: 2px dashed rgba(251, 191, 36, 0.4);
            padding: 15px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.02);
        }

        .file-box p {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 5px;
        }

        .file-box input {
            display: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            color: white;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }

        /* 3. PRO DESIGNER BANNER PREVIEW */
        .banner-preview-box {
            position: relative;
            width: 100%;
            height: 420px;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            margin-bottom: 20px;
            background: linear-gradient(135deg, #1e1b4b, #311042, #0f172a);
            border: 3px solid #fbbf24;
        }

        /* Designer Background Graphics & Borders */
        .banner-preview-box::before {
            content: '';
            position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            border: 1px dashed rgba(251, 191, 36, 0.6);
            border-radius: 15px;
            pointer-events: none;
            z-index: 1;
        }

        .banner-header-art {
            position: relative;
            z-index: 2;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fde047;
            font-weight: 600;
        }

        .banner-title-main {
            position: relative;
            z-index: 2;
            font-size: 22px;
            font-weight: 700;
            font-family: 'Cinzel', serif;
            color: #fff;
            text-shadow: 0 2px 8px rgba(251, 191, 36, 0.6);
        }

        .user-photo-frame {
            position: relative;
            z-index: 2;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid #fbbf24;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.8);
            background: #000;
        }

        .user-photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-name-banner {
            position: relative;
            z-index: 2;
            background: linear-gradient(90deg, transparent, rgba(251, 191, 36, 0.2), transparent);
            width: 100%;
            padding: 10px 0;
        }

        .user-name-display {
            font-size: 20px;
            font-weight: 700;
            color: #fbbf24;
            font-family: 'Cinzel', serif;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            letter-spacing: 1px;
        }

        .whatsapp-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. SELECTION -->
        <div id="selection-section">
            <h2>🎨 Pro Designer Banners</h2>
            <div class="festival-grid">
                <div class="festival-card" onclick="selectFestival('DIWALI SPECIAL', '🪔', 'Shubh Deepawali')">
                    <i class="fa-solid fa-fire-flame-curved"></i>
                    <h4>Diwali</h4>
                </div>
                <div class="festival-card" onclick="selectFestival('HOLI SPECIAL', '🎨', 'Happy Rang Panchami')">
                    <i class="fa-solid fa-palette"></i>
                    <h4>Holi</h4>
                </div>
                <div class="festival-card" onclick="selectFestival('INDEPENDENCE DAY', '🇮🇳', 'Jai Hind')">
                    <i class="fa-solid fa-flag"></i>
                    <h4>Independence</h4>
                </div>
                <div class="festival-card" onclick="selectFestival('NEW YEAR', '✨', 'Welcome 2026')">
                    <i class="fa-solid fa-champagne-glasses"></i>
                    <h4>New Year</h4>
                </div>
                <div class="festival-card" onclick="selectFestival('BIRTHDAY SPECIAL', '🎂', 'Happy Birthday')" style="grid-column: span 2;">
                    <i class="fa-solid fa-cake-candles"></i>
                    <h4>Birthday Celebration</h4>
                </div>
            </div>
        </div>

        <!-- 2. FORM -->
        <div id="form-section" class="hidden">
            <a class="back-link" onclick="goBackToSelection()"><i class="fa-solid fa-arrow-left"></i> Back</a>
            <h2 id="form-heading">Enter Details</h2>
            
            <form id="bannerForm">
                <div class="form-group">
                    <label>Aapka Naam</label>
                    <input type="text" id="userName" placeholder="Jaise: Mahendra" required>
                </div>
                <div class="form-group">
                    <label>Aapki Photo</label>
                    <div class="file-box" onclick="document.getElementById('userPhoto').click()">
                        <i class="fa-solid fa-image fa-2x" style="color: #fbbf24;"></i>
                        <p id="file-label">Photo Upload karne ke liye click karein</p>
                        <input type="file" id="userPhoto" accept="image/*" required onchange="previewImageName()">
                    </div>
                </div>
                <button type="submit" class="btn">Generate Pro Banner</button>
            </form>
        </div>

        <!-- 3. PREVIEW -->
        <div id="preview-section" class="hidden">
            <h2>🔥 Pro Banner Ready!</h2>
            
            <div class="banner-preview-box" id="bannerCard">
                <div class="banner-header-art" id="banner-tagline">Shubh Deepawali</div>
                <div class="banner-title-main" id="preview-title">DIWALI SPECIAL</div>
                
                <div class="user-photo-frame">
                    <img id="preview-img" src="" alt="User Photo">
                </div>

                <div class="user-name-banner">
                    <div class="user-name-display" id="preview-name">Mahendra</div>
                </div>
            </div>

            <button class="btn whatsapp-btn" onclick="shareOnWhatsApp()">
                <i class="fa-brands fa-whatsapp"></i> Share on WhatsApp
            </button>
            <button class="btn" style="background: rgba(255,255,255,0.1); margin-top: 8px;" onclick="goBackToSelection()">Create Another</button>
        </div>
    </div>

    <script>
        const selectionSection = document.getElementById('selection-section');
        const formSection = document.getElementById('form-section');
        const previewSection = document.getElementById('preview-section');
        const formHeading = document.getElementById('form-heading');
        const previewTitle = document.getElementById('preview-title');
        const bannerTagline = document.getElementById('banner-tagline');
        const previewName = document.getElementById('preview-name');
        const previewImg = document.getElementById('preview-img');
        const bannerForm = document.getElementById('bannerForm');
        
        let selectedCategory = "";
        let selectedTagline = "";
        let uploadedImageUrl = "";

        function selectFestival(category, emoji, tagline) {
            selectedCategory = emoji + " " + category;
            selectedTagline = tagline;
            formHeading.innerText = category;
            selectionSection.classList.add('hidden');
            formSection.classList.remove('hidden');
        }

        function goBackToSelection() {
            formSection.classList.add('hidden');
            previewSection.classList.add('hidden');
            selectionSection.classList.remove('hidden');
            bannerForm.reset();
            document.getElementById('file-label').innerText = "Photo Upload karne ke liye click karein";
        }

        function previewImageName() {
            const input = document.getElementById('userPhoto');
            const label = document.getElementById('file-label');
            if(input.files && input.files[0]) {
                label.innerText = "Selected: " + input.files[0].name;
                label.style.color = "#22c55e";

                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImageUrl = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        bannerForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('userName').value;

            previewTitle.innerText = selectedCategory;
            bannerTagline.innerText = selectedTagline;
            previewName.innerText = name;
            if(uploadedImageUrl) {
                previewImg.src = uploadedImageUrl;
            }

            formSection.classList.add('hidden');
            previewSection.classList.remove('hidden');
        });

        function shareOnWhatsApp() {
            const text = `Maine apna professional designer banner banaya hai! Aap bhi yahan bana sakte hain: ${window.location.href}`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
        }
    </script>
</body>
</html>
